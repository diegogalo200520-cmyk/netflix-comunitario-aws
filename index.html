<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudFlix AWS</title>
  <!-- Icono para la pestaña del navegador -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Guardián de Autenticación: Valida sesión antes de renderizar nada -->
  <script>
    if (!localStorage.getItem('jwtToken')) {
      window.location.href = 'login.html';
    }
  </script>

  <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background-color: #141414;">
    <h1 style="margin: 0; color: #e50914;">CloudFlix AWS</h1>
    
    <!-- Botón de Cerrar Sesión -->
    <button id="btnLogout" style="background-color: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Cerrar Sesión
    </button>
  </header>

  <div class="contenedor">
    <!-- SECCIÓN 1: Formulario para subir videos -->
    <section class="caja">
      <h2>1. Subir un video</h2>
      <form id="formularioSubida">
        <input type="file" id="archivoVideo" accept="video/mp4" required>
        <button type="submit" id="btnSubir">Enviar a la Nube</button>
      </form>
    </section>

    <!-- SECCIÓN 2: El reproductor de pantalla grande -->
    <section class="caja">
      <h2>2. Reproductor</h2>
      <video id="reproductorPrincipal" controls width="100%">
        Tu navegador no soporta la etiqueta de video.
      </video>
    </section>

    <!-- SECCIÓN 3: La lista o catálogo de videos disponibles -->
    <section class="caja">
      <h2>3. Lista de Videos</h2>
      <div id="listaVideos" class="cuadricula">
        <!-- La lista se llenará dinámicamente -->
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
